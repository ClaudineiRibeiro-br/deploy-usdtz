const SALT = 1071;

function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.style.display = 'block';
  el.className = type;
  el.innerHTML = msg;
}

function setStep(n, state) {
  document.getElementById('step' + n).className = 'step ' + state;
}

async function estimateGas(from, data, to) {
  try {
    const params = to ? { from, to, data } : { from, data };
    const est = await window.ethereum.request({ method: 'eth_estimateGas', params: [params] });
    return '0x' + Math.ceil(parseInt(est, 16) * 1.3).toString(16);
  } catch(e) { return '0x16E360'; }
}

async function waitReceipt(txHash) {
  for (let i = 0; i < 40; i++) {
    await new Promise(r => setTimeout(r, 3000));
    const receipt = await window.ethereum.request({
      method: 'eth_getTransactionReceipt',
      params: [txHash]
    });
    if (receipt) return receipt;
  }
  return null;
}

async function start() {
  const btn = document.getElementById('btn');
  if (!window.ethereum) { showStatus('❌ MetaMask não encontrada.', 'error'); return; }
  try {
    btn.disabled = true;
    btn.textContent = 'Processando...';

    await window.ethereum.request({ method: 'eth_requestAccounts' });

    const chainId = await window.ethereum.request({ method: 'eth_chainId' });
    if (chainId !== '0x38') {
      showStatus('⚠️ Troque para a <b>BNB Smart Chain</b>.', 'error');
      btn.disabled = false;
      btn.textContent = '🚀 Iniciar Deploy';
      return;
    }

    const accounts = await window.ethereum.request({ method: 'eth_accounts' });
    const from = accounts[0];

    // PASSO 1: Deploy da Factory
    setStep(1, 'active');
    showStatus('⏳ Passo 1: Confirme o deploy da Factory...', 'info');

    const gas1 = await estimateGas(from, FACTORY_BYTECODE);
    const factoryTx = await window.ethereum.request({
      method: 'eth_sendTransaction',
      params: [{ from, data: FACTORY_BYTECODE, gas: gas1 }]
    });

    showStatus('⏳ Aguardando confirmação da Factory...<br>TX: ' + factoryTx, 'info');
    const receipt1 = await waitReceipt(factoryTx);

    if (!receipt1 || !receipt1.contractAddress) {
      showStatus('❌ Falha ao obter endereço da Factory.', 'error');
      btn.disabled = false; btn.textContent = '🚀 Iniciar Deploy';
      return;
    }

    const factoryAddress = receipt1.contractAddress;
    setStep(1, 'done');

    // PASSO 2: Chamar deploy(1071) — seletor correto: a5e38751
    await new Promise(r => setTimeout(r, 2000));
    setStep(2, 'active');
    showStatus('⏳ Passo 2: Confirme o deploy do USDT.z...', 'info');

    const saltEncoded = SALT.toString(16).padStart(64, '0');
    const callData = '0xa5e38751' + saltEncoded;

    const gas2 = await estimateGas(from, callData, factoryAddress);
    const deployTx = await window.ethereum.request({
      method: 'eth_sendTransaction',
      params: [{ from, to: factoryAddress, data: callData, gas: gas2 }]
    });

    showStatus('⏳ Aguardando confirmação do USDT.z...<br>TX: ' + deployTx, 'info');
    const receipt2 = await waitReceipt(deployTx);

    // Endereço do contrato está no log[0].data (evento Deployed)
    let contractAddr = '???';
    if (receipt2 && receipt2.logs && receipt2.logs.length > 0) {
      // addr é o primeiro tópico não-indexed ou está no data
      const log = receipt2.logs[receipt2.logs.length - 1];
      if (log.data && log.data.length >= 66) {
        contractAddr = '0x' + log.data.slice(-40);
      }
    }

    setStep(2, 'done');
    showStatus(
      '🎉 <b>USDT.z deployado!</b><br><br>' +
      '<b>Endereço do contrato:</b><br>' +
      '<span style="color:#00ff88;font-size:15px;">' + contractAddr + '</span><br><br>' +
      '<b>Factory:</b> ' + factoryAddress + '<br><br>' +
      '🔍 <a href="https://bscscan.com/tx/' + deployTx + '" target="_blank" style="color:#00d4ff;">Ver no BscScan ↗</a>',
      'success'
    );
    btn.textContent = '✅ Deploy Concluído!';

  } catch (err) {
    showStatus('❌ Erro: ' + err.message, 'error');
    btn.disabled = false;
    btn.textContent = '🚀 Iniciar Deploy';
  }
}
