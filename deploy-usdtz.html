function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.style.display = 'block';
  el.className = type;
  el.innerHTML = msg;
}

async function estimateGas(from) {
  try {
    const estimated = await window.ethereum.request({
      method: 'eth_estimateGas',
      params: [{ from: from, data: BYTECODE }]
    });
    const gasInt = parseInt(estimated, 16);
    const gasWithMargin = Math.ceil(gasInt * 1.3);
    document.getElementById('gas-info').textContent = 'Gas estimado: ' + gasInt.toLocaleString() + ' (+30% margem = ' + gasWithMargin.toLocaleString() + ')';
    return '0x' + gasWithMargin.toString(16);
  } catch(e) {
    document.getElementById('gas-info').textContent = 'Gas: fallback 1.500.000';
    return '0x16E360';
  }
}

async function deploy() {
  const btn = document.getElementById('btn');
  if (!window.ethereum) {
    showStatus('❌ MetaMask não encontrada. Instale a extensão MetaMask.', 'error');
    return;
  }
  try {
    btn.disabled = true;
    btn.textContent = 'Conectando...';

    await window.ethereum.request({ method: 'eth_requestAccounts' });

    const chainId = await window.ethereum.request({ method: 'eth_chainId' });
    if (chainId !== '0x38') {
      showStatus('⚠️ Troque para a rede <b>BNB Smart Chain</b> na MetaMask.<br>Chain ID deve ser 56 (0x38).', 'error');
      btn.disabled = false;
      btn.textContent = '🚀 Conectar MetaMask e Fazer Deploy';
      return;
    }

    const accounts = await window.ethereum.request({ method: 'eth_accounts' });
    const from = accounts[0];

    btn.textContent = 'Estimando gas...';
    showStatus('⏳ Estimando gas necessário...', 'info');
    const gas = await estimateGas(from);

    btn.textContent = 'Fazendo deploy...';
    showStatus('⏳ Confirme a transação na MetaMask.', 'info');

    const tx = await window.ethereum.request({
      method: 'eth_sendTransaction',
      params: [{ from: from, data: BYTECODE, gas: gas }]
    });

    showStatus(
      '✅ <b>Deploy enviado!</b><br><br>' +
      '<b>TX Hash:</b><br>' + tx + '<br><br>' +
      '<b>Conta:</b><br>' + from + '<br><br>' +
      '🔍 <a href="https://bscscan.com/tx/' + tx + '" target="_blank" style="color:#00d4ff;">Ver no BscScan ↗</a><br><br>' +
      '<small>Aguarde ~15s. O endereço do contrato aparece no BscScan em "To: [Contract Address Created]"</small>',
      'success'
    );
    btn.textContent = '✅ Deploy enviado!';

  } catch (err) {
    showStatus('❌ Erro: ' + err.message, 'error');
    btn.disabled = false;
    btn.textContent = '🚀 Conectar MetaMask e Fazer Deploy';
  }
}
