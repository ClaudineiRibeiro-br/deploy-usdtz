function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.style.display = 'block';
  el.className = type;
  el.innerHTML = msg;
}

async function deploy() {
  const btn = document.getElementById('btn');
  
  if (!window.ethereum) {
    showStatus('❌ MetaMask não encontrada. Instale a extensão MetaMask.', 'error');
    return;
  }

  try {
    btn.disabled = true;
    btn.textContent = 'Conectando...';
    
    await window.ethereum.request({ method: 'eth_requestAccounts' });
    
    const chainId = await window.ethereum.request({ method: 'eth_chainId' });
    if (chainId !== '0x38') {
      showStatus('⚠️ Troque para a rede BNB Smart Chain na MetaMask e tente novamente.', 'error');
      btn.disabled = false;
      btn.textContent = 'Conectar MetaMask e Fazer Deploy';
      return;
    }

    btn.textContent = 'Fazendo deploy...';
    showStatus('⏳ Aguarde... Confirme a transação na MetaMask.', 'info');

    const accounts = await window.ethereum.request({ method: 'eth_accounts' });
    const from = accounts[0];

    const tx = await window.ethereum.request({
      method: 'eth_sendTransaction',
      params: [{
        from: from,
        data: BYTECODE,
        gas: '0x493E0'
      }]
    });

    showStatus(`✅ Transação enviada!<br><br><b>TX Hash:</b> ${tx}<br><br>Aguarde a confirmação na BSC. Depois adicione o contrato no Trust Wallet.`, 'success');
    btn.textContent = 'Deploy enviado!';

  } catch (err) {
    showStatus('❌ Erro: ' + err.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Conectar MetaMask e Fazer Deploy';
  }
}
